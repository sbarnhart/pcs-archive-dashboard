[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcs-full-export"
version = "0.1.0"
description = "Read-only, restartable full export tool for Party Center Software"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
pcs-export = "pcs_export.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pcs_export"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
